$kind: http-request
url: http://localhost:5000/api/mid-marks
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{ctpo_token}}
body:
  type: text
  content: |-
    {
      "studentId": "{{student_id}}",
      "semesterId": "{{semester_id}}",
      "midExam": "MID-1",
      "marks": [
        {
          "subjectId": "{{subject_id_1}}",
          "marks": 18,
          "maxMarks": 30
        },
        {
          "subjectId": "{{subject_id_2}}",
          "marks": 14,
          "maxMarks": 30
        }
      ]
    }
order: 4000
